name: Build Desktop Release

# Builds the double-click desktop bundles for macOS and Windows and attaches
# them to the GitHub Release. There's no cross-compilation: the .app must be
# built on a macOS runner and the .exe on a Windows runner, so we fan out over
# a runner matrix. Triggered by pushing a version tag (v1.2.3), or manually.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write  # needed to upload assets to the Release

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            script: bash packaging/build_macos.sh
            artifact: dist/GeneLens-*.zip
          - os: windows-latest
            script: packaging\build_windows.bat
            artifact: dist/GeneLens-*.exe

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt

      - name: Smoke-test the suite before packaging
        run: pytest tests/ -q

      - name: Build bundle
        env:
          PYTHON: python
        run: ${{ matrix.script }}

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.os }}-bundle
          path: ${{ matrix.artifact }}

      - name: Attach to GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ matrix.artifact }}
